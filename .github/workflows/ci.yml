name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions follow the principle of least privilege (read-only by default).
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MAW has ZERO runtime dependencies, so there is nothing to cache and
      # nothing to install. We deliberately do NOT use `cache: 'npm'` because
      # there is no package-lock.json (that caused the previous CI failure).
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node version
        run: node --version

      - name: Run tests
        run: node scripts/run-tests.mjs

      - name: Smoke (version)
        run: node bin/mawf.js version

      # `doctor` needs a local cc-switch DB + codex, which CI runners do not
      # have — it is expected to warn, not fail the build.
      - name: Smoke (doctor)
        continue-on-error: true
        run: node bin/mawf.js doctor
