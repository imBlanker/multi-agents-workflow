name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Rapid pushes to the same PR supersede older runs: cancel them instead of
# paying for queued duplicates (Windows jobs bill at 2x).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permissions follow the principle of least privilege (read-only by default).
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Bound runaway jobs — the suite needs ~1 min; 10 is a generous ceiling.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Cost control: pay-as-you-go — automatic PR/push CI runs Linux only
        # (1x billing). Windows (2x billing, spawn-heavy suite is slow there)
        # is verified via the manual windows job below (workflow_dispatch),
        # e.g. before releases; historical full-matrix Windows-green evidence:
        # runs 35231323588 / 35235106160 / 35244867027 / 35246743178.
        os: [ubuntu-latest]
        node: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MAW has ZERO runtime dependencies, so there is nothing to cache and
      # nothing to install. We deliberately do NOT use `cache: 'npm'` because
      # there is no package-lock.json (that caused the previous CI failure).
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Node version
        run: node --version

      - name: Run tests
        run: node scripts/run-tests.mjs

      - name: Smoke (version)
        run: node bin/mawf.js version

      # `doctor` needs a local cc-switch DB + codex, which CI runners do not
      # have — it is expected to warn, not fail the build.
      - name: Smoke (doctor)
        continue-on-error: true
        run: node bin/mawf.js doctor

  # Windows verification, MANUAL only (Actions tab → CI → "Run workflow"):
  # run before tagging a release. Not in the automatic matrix — Windows bills
  # 2x and the spawn-heavy suite needs several minutes there.
  windows:
    if: github.event_name == 'workflow_dispatch'
    name: Windows (${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node scripts/run-tests.mjs
      - name: Smoke (version)
        run: node bin/mawf.js version
